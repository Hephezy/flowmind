name: API deployment
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  api:
    if: vars.ENABLE_RAILWAY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck -w @flowmind/api
      - run: npm run test -w @flowmind/api
      - run: npm run build -w @flowmind/api
      - run: npx @railway/cli up --service flowmind-api --detach
        env: { RAILWAY_TOKEN: "${{ secrets.RAILWAY_TOKEN }}" }
